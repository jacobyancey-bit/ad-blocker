<!-- Representative video.js + Google IMA player during a pre-roll. -->
<main>
  <article>
    <h1>Local news: storm update</h1>
    <div id="news-player" class="video-js vjs-fluid vjs-ad-playing vjs-has-started">
      <video class="vjs-tech" playsinline></video>
      <div class="ima-ad-container">
        <div class="ima-controls-div">
          <div class="ima-countdown-div">Advertisement · 0:20</div>
        </div>
      </div>
      <div class="vjs-control-bar">
        <button class="vjs-play-control">Pause</button>
        <button class="vjs-mute-control">Mute</button>
      </div>
    </div>
  </article>
</main>
