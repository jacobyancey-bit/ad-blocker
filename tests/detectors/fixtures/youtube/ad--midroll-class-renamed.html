<!-- YouTube mid-roll where the ad-showing class is missing (e.g. renamed) — must still detect via corroborating signals. -->
<div id="movie_player" class="html5-video-player playing-mode">
  <div class="html5-video-container"><video class="video-stream html5-main-video"></video></div>
  <div class="video-ads ytp-ad-module">
    <div class="ytp-ad-player-overlay-layout">
      <div class="ytp-ad-player-overlay-layout__ad-info-container">
        <span class="ytp-ad-simple-ad-badge"><div class="ytp-ad-text">Ad 1 of 1</div></span>
        <div class="ytp-ad-duration-remaining"><div class="ytp-ad-text">0:28</div></div>
      </div>
    </div>
  </div>
</div>
