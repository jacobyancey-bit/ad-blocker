<!-- Representative YouTube watch page during a skippable pre-roll (2 ads in pod). -->
<ytd-app>
  <div id="player-container">
    <div id="movie_player" class="html5-video-player ytp-transparent ytp-exp-bottom-control-flexbox ad-showing ad-interrupting ad-created playing-mode ytp-autohide">
      <div class="html5-video-container">
        <video class="video-stream html5-main-video" tabindex="-1"></video>
      </div>
      <div class="video-ads ytp-ad-module">
        <div class="ytp-ad-player-overlay-layout">
          <div class="ytp-ad-player-overlay-layout__ad-info-container">
            <div class="ytp-ad-badge ytp-ad-badge--clean-player">
              <span class="ytp-ad-badge__text--clean-player">Sponsored</span>
            </div>
            <div class="ytp-ad-pod-index">· 1 of 2 ·</div>
            <div class="ytp-ad-duration-remaining"><div class="ytp-ad-text">0:14</div></div>
          </div>
          <div class="ytp-ad-player-overlay-layout__skip-or-preview-container">
            <button class="ytp-skip-ad-button"><div class="ytp-skip-ad-button__text">Skip</div></button>
          </div>
        </div>
      </div>
      <div class="ytp-chrome-bottom">
        <button class="ytp-play-button" aria-label="Pause (k)"></button>
        <span class="ytp-time-current">0:01</span>
      </div>
    </div>
  </div>
</ytd-app>
