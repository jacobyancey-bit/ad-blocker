<!-- Representative Hulu player during a mid-roll ad break. -->
<div id="web-player-app">
  <div class="Player Player--fullscreen">
    <div class="VideoContainer"><video class="content-video-player__video"></video></div>
    <div class="AdUnitView">
      <div class="AdUnitView__adBar">
        <span class="AdBadge">Ad</span>
        <span class="AdUnitView__podIndex">2 of 3</span>
      </div>
      <div class="AdUnitView__countdown">1:15</div>
    </div>
    <div class="ControlsContainer">
      <button aria-label="Pause">Pause</button>
      <button aria-label="Volume">Volume</button>
    </div>
  </div>
</div>
