<!-- Representative Hulu player playing an episode. Empty ad container stays mounted. -->
<div id="web-player-app">
  <div class="Player">
    <div class="VideoContainer"><video class="content-video-player__video"></video></div>
    <div class="ad-container"></div>
    <div class="ControlsContainer">
      <div class="ControlsContainer__title">Only Murders in the Building</div>
      <div class="ControlsContainer__subtitle">S4 E3 · The Stunt Man</div>
      <button aria-label="Pause">Pause</button>
      <span class="Timeline__time">18:42</span>
      <div class="Timeline__markers" aria-label="Ad markers"></div>
    </div>
  </div>
</div>
