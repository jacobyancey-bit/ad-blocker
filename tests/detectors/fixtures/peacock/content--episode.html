<!-- Representative Peacock player playing an episode. -->
<div class="playback-container">
  <div class="video-wrapper"><video></video></div>
  <div class="ad-countdown__container" hidden>
    <span class="ad-countdown__label">Ad</span>
    <span class="ad-countdown__time">0:00</span>
  </div>
  <div class="playback-controls">
    <div class="playback-controls__title">The Office</div>
    <div class="playback-controls__subtitle">Season 3, Episode 12 · Traveling Salesmen</div>
    <button aria-label="Pause">Pause</button>
    <span class="playback-controls__time">07:15 / 21:30</span>
    <div class="load-countdown">Next episode in 10</div>
  </div>
</div>
