<!-- Representative Twitch channel during a pre-roll / mid-roll ad. -->
<div class="channel-root">
  <div data-a-target="video-player" class="video-player">
    <div class="video-player__container"><video playsinline></video></div>
    <div class="video-player__overlay">
      <div class="ad-overlay">
        <span data-a-target="video-ad-label">Ad</span>
        <span data-a-target="video-ad-countdown">0:25</span>
      </div>
      <div class="player-controls">
        <button data-a-target="player-play-pause-button" aria-label="Pause">Pause</button>
      </div>
    </div>
  </div>
</div>
