<!-- Representative Twitch live channel playing content; chat mentions ads/sponsors. -->
<div class="channel-root">
  <div data-a-target="video-player" class="video-player">
    <div class="video-player__container"><video playsinline></video></div>
    <div class="video-player__overlay">
      <div class="tw-channel-status-text-indicator">LIVE</div>
      <div class="player-controls">
        <button data-a-target="player-play-pause-button" aria-label="Pause">Pause</button>
        <span class="live-time">2:14:09</span>
      </div>
    </div>
  </div>
  <section class="chat-room">
    <div class="chat-line">streamer: ads in 5 minutes, grab a drink</div>
    <div class="chat-line">viewer42: Commercial break in progress lol</div>
    <div class="chat-line">mod: Sponsored</div>
  </section>
</div>
